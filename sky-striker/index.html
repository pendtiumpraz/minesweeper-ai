<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sky Striker — Vertical Shooter</title>
<style>
  /* ============================================================
     SKY STRIKER — UI styling
     A clean, modern dark space-shooter aesthetic.
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #060a14;
    --panel: rgba(10, 18, 34, 0.85);
    --border: rgba(90, 150, 255, 0.25);
    --cyan: #58d6ff;
    --cyan-dim: #2b7f9e;
    --accent: #ffd54a;
    --danger: #ff5b6a;
    --text: #d7e6ff;
    --muted: #7f94b8;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }

  #game-wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #0a1526 0%, var(--bg) 70%);
  }

  #game {
    position: relative;
    background: #0a0f1c;
    box-shadow: 0 0 60px rgba(40, 120, 255, 0.25), 0 0 0 1px var(--border);
    border-radius: 10px;
    overflow: hidden;
    touch-action: none;
  }

  #viewport { display: block; width: 100%; height: 100%; }

  /* ---------- Overlay screens (start / game-over / pause) ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(5, 9, 18, 0.78);
    backdrop-filter: blur(4px);
    transition: opacity .3s ease;
    z-index: 10;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay h1 {
    font-size: 46px;
    letter-spacing: 4px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--cyan), #9be4ff 40%, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(88, 214, 255, 0.35);
    margin-bottom: 4px;
  }
  .overlay .sub {
    color: var(--muted);
    letter-spacing: 3px;
    font-size: 13px;
    margin-bottom: 26px;
  }

  .btn {
    display: inline-block;
    cursor: pointer;
    padding: 13px 38px;
    margin-top: 12px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--bg);
    background: linear-gradient(180deg, #ffd95c, var(--accent));
    border: none;
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(255, 213, 74, 0.35);
    transition: transform .1s ease, box-shadow .2s ease;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 26px rgba(255, 213, 74, 0.5); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: transparent;
    color: var(--cyan);
    box-shadow: none;
    border: 1px solid var(--cyan);
  }

  .controls-hint {
    margin-top: 26px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }
  .controls-hint b { color: var(--text); font-weight: 600; }

  .score-final { font-size: 46px; font-weight: 800; color: var(--accent); margin-bottom: 2px; }
  .score-label { color: var(--muted); letter-spacing: 2px; font-size: 12px; margin-bottom: 6px; }
  .high-label { color: var(--accent); font-size: 16px; margin: 6px 0 8px; }
  .new-record {
    color: var(--accent);
    animation: pulse 1s infinite;
    font-weight: 800;
    letter-spacing: 2px;
    margin-top: 6px;
  }
  @keyframes pulse { 0%,100% {opacity:1;} 50% {opacity:.45;} }

  .stats-row {
    display: flex;
    gap: 34px;
    margin: 12px 0 6px;
    color: var(--muted);
    font-size: 14px;
  }
  .stats-row b { color: var(--text); }

  /* AUTOPLAY toggle switch */
  .switch-row { display: flex; align-items: center; gap: 12px; justify-content: center; margin-top: 18px; }
  .switch { position: relative; width: 52px; height: 28px; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: #233252;
    border-radius: 999px;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute; height: 22px; width: 22px; left: 3px; top: 3px;
    background: #cfe0ff;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(24px); background: #062a25; }
  .switch-label { font-weight: 700; letter-spacing: 1px; }
  .switch-label.on { color: var(--accent); }
  .auto-hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body>
  <div id="game-wrap">
    <div id="game"></div>
  </div>

<script>

/* ============================================================
   SKY STRIKER — Vertical Airplane Shooter
   ------------------------------------------------------------
   Fully self-contained single-file HTML5 arcade shooter.

   Features:
     • Classic vertical scrolling shooter
     • Player airplane: arrow keys / WASD + Space to shoot
     • Touch: drag to move, auto-fire (tap fires too)
     • Enemies descend in varied patterns & formations
     • Some enemies shoot back
     • Particles & explosions
     • Power-ups: weapon upgrade ★, shield ◈, extra life ❤
     • Score, lives, wave progression, increasing difficulty
     • High score saved to localStorage
     • Start screen, game-over, restart, pause (P/Esc)
     • requestAnimationFrame 60fps loop with fixed timestep

   Architecture:
     - Game object holds state + entity arrays
     - Entities are plain objects updated by per-type systems
     - Rendering draws everything onto a <canvas> each frame
   ============================================================ */

(function () {
  "use strict";

  const GAME = document.getElementById("game");
  const canvas = document.createElement("canvas");
  canvas.id = "viewport";
  GAME.appendChild(canvas);
  const ctx = canvas.getContext("2d");

  /* ----------------------- Canvas sizing ----------------------- */
  // Fixed logical game area; scaled to fit the window.
  const W = 420;
  const H = 700;

  function resize() {
    const maxH = Math.round(window.innerHeight * 0.98);
    const maxW = Math.round(window.innerWidth * 0.98);
    const scale = Math.min(maxW / W, maxH / H);
    const w = Math.floor(W * scale);
    const h = Math.floor(H * scale);
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    GAME.style.width = w + "px";
    GAME.style.height = h + "px";
  }
  window.addEventListener("resize", resize);
  resize();

  /* ============================================================
     INPUT
     ============================================================ */
  const keys = {};
  let mouseDown = false;
  let mouseX = W / 2;
  let touchActive = false;
  const touchAutoFire = true;   // auto-fire while touching (mobile-friendly)

  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    if (e.code === "Space") e.preventDefault();
    // Toggle autoplay mid-game or in menu
    if (e.code === "KeyA" && !e.repeat) toggleAutoplay();
    // Start game with Enter / Space from menu
    if (e.code === "Enter" && game.state === "menu") startGame();
    if ((e.code === "KeyP" || e.code === "Escape") && game.state === "playing") {
      game.state = "paused"; updateOverlays();
    } else if ((e.code === "KeyP" || e.code === "Escape") && game.state === "paused") {
      game.state = "playing"; updateOverlays();
    }
  });
  window.addEventListener("keyup", (e) => { keys[e.code] = false; });

  // Mouse: click/drag moves and fires.
  canvas.addEventListener("mousedown", (e) => {
    mouseDown = true; setPointer(e);
  });
  window.addEventListener("mouseup", () => { mouseDown = false; });
  window.addEventListener("mousemove", (e) => { if (mouseDown) setPointer(e); });

  function setPointer(e) {
    const r = canvas.getBoundingClientRect();
    mouseX = ((e.clientX - r.left) / r.width) * W;
  }

  // Touch: drag to move, auto-fire while touching.
  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    touchActive = true;
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    mouseX = ((t.clientX - r.left) / r.width) * W;
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const t = e.touches[0];
    mouseX = ((t.clientX - r.left) / r.width) * W;
  }, { passive: false });

  const clearTouch = (e) => { e.preventDefault(); touchActive = false; };
  canvas.addEventListener("touchend", clearTouch, { passive: false });
  canvas.addEventListener("touchcancel", clearTouch, { passive: false });

  /* ============================================================
     GAME STATE
     ============================================================ */
  const LS_KEY = "skyStrikerHighScore";
  const highScore = (() => { try { return +localStorage.getItem(LS_KEY) || 0; } catch (e) { return 0; } })();

  const game = {
    state: "menu",      // menu | playing | paused | over
    score: 0,
    lives: 3,
    wave: 0,
    waveTimer: 0,
    currentHigh: highScore,
    newRecord: false,
    autoplay: false,
    time: 0,
    shake: 0,
    flashTimer: 0,      // red damage flash
    waveBanner: 0,      // "Wave N" banner timer
    player: null,
    bullets: [],
    enemyBullets: [],
    enemies: [],
    particles: [],
    powerups: [],
    stars: [],
    spawnQueue: [],
    stats: { kills: 0, shotsFired: 0, hitsTaken: 0 },
  };

  function resetGame() {
    game.score = 0;
    game.lives = 3;
    game.wave = 0;
    game.waveTimer = 2.2;
    game.time = 0;
    game.shake = 0;
    game.flashTimer = 0;
    game.waveBanner = 0;
    game.newRecord = false;
    game.stats = { kills: 0, shotsFired: 0, hitsTaken: 0 };
    game.bullets.length = 0;
    game.enemyBullets.length = 0;
    game.enemies.length = 0;
    game.particles.length = 0;
    game.powerups.length = 0;
    game.spawnQueue.length = 0;
    game.player = {
      x: W / 2, y: H - 70,
      w: 34, h: 40,
      speed: 340,
      fireRate: 0.16,
      fireCd: 0,
      level: 1,
      invuln: 0,
      shield: 0,
      alive: true,
      flash: 0,
    };
    initStarfield();
  }

  function saveHighScore() {
    if (game.score > game.currentHigh) {
      game.currentHigh = game.score;
      try { localStorage.setItem(LS_KEY, String(game.score)); } catch (e) {}
    }
  }

  /* ============================================================
     STARFIELD (parallax background)
     ============================================================ */
  function initStarfield() {
    game.stars.length = 0;
    for (let i = 0; i < 110; i++) {
      game.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        speed: 30 + Math.random() * 120,
        size: Math.random() < 0.8 ? 1 : 2,
        tw: Math.random() * 6.28,
      });
    }
  }

  function updateStarfield(dt) {
    const s = 1 + Math.min(game.wave, 8) * 0.06;
    for (let i = 0; i < game.stars.length; i++) {
      const st = game.stars[i];
      st.y += st.speed * s * dt;
      if (st.y > H) { st.y = -2; st.x = Math.random() * W; }
    }
  }

  /* ============================================================
     POWER-UP TYPES
     ============================================================ */
  const POWERUPS = [
    { id: "weapon", char: "★", color: "#ffd54a", label: "Weapon Upgrade" },
    { id: "shield", char: "◈", color: "#58d6ff", label: "Shield" },
    { id: "life",   char: "❤", color: "#ff5b6a", label: "Extra Life" },
  ];

  /* ============================================================
     PARTICLES & EXPLOSIONS
     ============================================================ */
  function spawnExplosion(x, y, color, count, speed, life) {
    const cols = Array.isArray(color) ? color : [color];
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = (0.4 + Math.random()) * speed;
      game.particles.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        life: life * (0.5 + Math.random() * 0.5),
        maxLife: life,
        size: 1.5 + Math.random() * 3,
        color: cols[(Math.random() * cols.length) | 0],
      });
    }
  }

  function spawnFlash(x, y, color, size) {
    game.particles.push({
      x, y, vx: 0, vy: 0,
      life: 0.25, maxLife: 0.25,
      size: size || 10,
      flash: true, color: color || "#ffffff",
    });
  }

  function updateParticles(dt) {
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const p = game.particles[i];
      p.life -= dt;
      if (p.life <= 0) { game.particles.splice(i, 1); continue; }
      p.vx *= (1 - 1.6 * dt);
      p.vy *= (1 - 1.2 * dt);
      if (!p.flash) p.vy += 50 * dt;
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
    }
  }

  /* ============================================================
     PLAYER WEAPON
     ============================================================ */
  function firePlayer() {
    const p = game.player;
    game.stats.shotsFired++;

    function mk(ox, vy) {
      game.bullets.push({
        x: p.x + ox, y: p.y - 14,
        w: 5, h: 16, vy, dmg: 1,
        fromPlayer: true,
      });
    }
    switch (p.level) {
      case 1: mk(0, -520); break;
      case 2: mk(-9, -520); mk(9, -520); break;
      case 3:
        mk(-12, -520); mk(0, -560); mk(12, -520);
        break;
    }
    // Muzzle flash
    spawnFlash(p.x, p.y - 16, "#bdf0ff", 6);
  }

  /* ---- AUTOPLAY BOT (demo AI) ---- */
  // Defines a desired horizontal target plane; avoids enemy fire, pursues enemies.
  let _botTargetX = W / 2;
  let _botFocusEnemy = null; // {x, y} to aim at for near-vertical firing

  function botThink() {
    const p = game.player;
    if (!p) return;
    let avoidX = 0, avoidY = 0;

    // 1) Evade enemy bullets (highest priority).
    for (const b of game.enemyBullets) {
      const bx = b.x - p.x, by = b.y - p.y;
      const d = Math.sqrt(bx * bx + by * by);
      if (d < 170) {
        const push = (170 - d) / 170;
        avoidX -= (bx / d) * push * 3.0;
        avoidY -= (by / d) * push * 3.0;
      }
    }

    // 2) Pursue the nearest enemy (hunt them down / align to shoot).
    let nearest = null, nearestD = Infinity;
    for (const e of game.enemies) {
      if (e.hp <= 0) continue;
      const d = Math.sqrt((e.x - p.x) * (e.x - p.x) + (e.y - p.y) * (e.y - p.y));
      if (d < nearestD) { nearestD = d; nearest = e; }
    }
    _botFocusEnemy = nearest;

    if (nearest) {
      // Steer horizontally toward the enemy column, hover at a safe-ish distance.
      const dx = nearest.x - p.x;
      const dy = nearest.y - p.y;
      const d = Math.max(1, Math.sqrt(dx * dx + dy * dy));
      // Position slightly above-ish / in front; mostly chase X, ease Y.
      avoidX += (dx / d) * 1.4;
      avoidY += (dy / d) * 0.6;
      if (d < 150) avoidY -= 0.9;      // back off a little if too close
      else if (d > 420) avoidY += 0.9; // close the gap if far
    }

    // 3) Bias toward screen center when near edges to avoid camping.
    if (p.x < 50) avoidX += 1.0;
    if (p.x > W - 50) avoidX -= 1.0;
    if (p.y < 60) avoidY += 0.8;
    if (p.y > H - 24) avoidY -= 0.8;

    // 4) Gentle wander so it never freezes.
    avoidY += Math.sin(game.time * 0.8 + p.x * 0.01) * 0.25;

    const len = Math.sqrt(avoidX * avoidX + avoidY * avoidY);
    if (len > 0.001) { _botTargetX = p.x + (avoidX / len) * 60; }
  }

  function botWantsFire() {
    // Fire whenever there's a target in reasonable range, or constantly pressure.
    if (_botFocusEnemy && _botFocusEnemy.y < p_y()) return true;
    return true; // keep constant fire pressure in demo mode
  }
  function p_y() { return game.player ? game.player.y : 0; }

  /* ============================================================
     PLAYER UPDATE
     ============================================================ */
  function updatePlayer(dt) {
    const p = game.player;
    if (!p.alive) return;

    if (p.fireCd > 0) p.fireCd -= dt;
    if (p.invuln > 0) p.invuln -= dt;
    if (p.shield > 0) p.shield -= dt;
    if (p.flash > 0) p.flash -= dt;

    // --- Movement ---
    let dx = 0, dy = 0;
    if (game.autoplay) {
      // AUTOPLAY BOT: seek targets / dodge bullets (no manual input).
      botThink();
      const tdx = _botTargetX - p.x;
      if (Math.abs(tdx) > 6) dx = Math.sign(tdx);
      // drive the ship at the whole movement speed toward the bot target
      p.x += dx * p.speed * dt;

      // gently ease Y toward the bot's preferred band, never above play field
      const targetY = Math.max(120, Math.min(H - 24, _botTargetY()));
      dy = (targetY - p.y) / Math.max(0.01, dt * 20);
      p.y += dy * dt;
    } else {
      if (keys["ArrowLeft"] || keys["KeyA"]) dx -= 1;
      if (keys["ArrowRight"] || keys["KeyD"]) dx += 1;
      if (keys["ArrowUp"] || keys["KeyW"]) dy -= 1;
      if (keys["ArrowDown"] || keys["KeyS"]) dy += 1;

      if (dx !== 0 || dy !== 0) {
        p.x += dx * p.speed * dt;
        p.y += dy * p.speed * dt;
      } else if (mouseDown || touchActive) {
        // Pointer / touch smoothing
        p.x += (mouseX - p.x) * Math.min(1, dt * 16);
      }
    }

    p.x = Math.max(18, Math.min(W - 18, p.x));
    p.y = Math.max(60, Math.min(H - 20, p.y));

    // --- Firing ---
    const wantFire = game.autoplay
      ? botWantsFire()
      : (keys["Space"] || mouseDown || touchActive);
    if (wantFire && p.fireCd <= 0) {
      firePlayer();
      p.fireCd = p.fireRate;
    }
  }

  // Bot vertical positioning helper (keeps ship alive and low-ish but engaging).
  function _botTargetY() {
    const p = game.player;
    let ty = p.y;
    if (_botFocusEnemy) {
      ty = Math.min(ty, _botFocusEnemy.y - 60);
    }
    // Pull toward the mid-upper play area when idle.
    ty = Math.min(ty, H - 80);
    ty = Math.max(140, ty);
    return ty;
  }

  /* ============================================================
     ENEMY DEFINITIONS
     ============================================================ */
  const ENEMY_TYPES = {
    scout:   { label:"Scout",   hp:1,  r:13, w:24, h:26, color:"#ff8a5c", speed:120, score:100, shoot:0 },
    fighter: { label:"Fighter", hp:2,  r:15, w:30, h:32, color:"#ff5b6a", speed:95,  score:200, shoot:0.35 },
    heavy:   { label:"Brute",   hp:6,  r:20, w:40, h:44, color:"#c58cff", speed:55,  score:400, shoot:0.5 },
    saucer:  { label:"Saucer",  hp:4,  r:17, w:36, h:24, color:"#58d6ff", speed:70,  score:300, shoot:0.45 },
    drone:   { label:"Drone",   hp:1,  r:12, w:26, h:20, color:"#7dffb0", speed:160, score:120, shoot:0 },
    boss:    { label:"Comet",   hp:55, r:30, w:70, h:52, color:"#ff4d4d", speed:38,  score:2000, shoot:0.015, isBoss:true },
  };

  /* ============================================================
     WAVE / SPAWN SYSTEM
     ============================================================ */
  function buildWave(n) {
    const list = [];
    const R = Math.random;

    // --- Continuous troop formations (scouts/drones keep coming) ---
    const troopEvery = Math.max(1.3, 3.0 - n * 0.18);
    let gx = 40;
    for (let t = 0.7; t < 16; t += troopEvery) {
      const group = 2 + Math.min(3, Math.floor(n / 2));
      list.push({ t, kind: "scout", x: gx, count: group, pattern: "line" });
      gx += 70; if (gx > W - 60) gx = 40;
    }

    // --- Signature events each wave ---
    // Sine strafers from both sides
    list.push({ t: 1.2, kind: "fighter", x: 40, pattern: "sine", times: 1 + Math.floor(n / 2) });
    list.push({ t: 1.9, kind: "fighter", x: W - 40, pattern: "sine", times: 1 + Math.floor(n / 2) });

    // V formation (middle)
    list.push({ t: 2.8, kind: "fighter", x: W / 2, pattern: "vform", count: 5 });

    // Heavy brute (wave 2+)
    if (n >= 2) list.push({ t: 4.4, kind: "heavy", x: W / 2 + (R()*2-1)*60, pattern: "drop" });

    // Weaving saucer (wave 3+)
    if (n >= 3) {
      list.push({ t: 5.8, kind: "saucer", x: 60 + R()*40, pattern: "weave", times: 1 + Math.floor(n / 3) });
    }

    // Side pinch (drones)
    list.push({ t: 7.2, kind: "drone", x: 30, pattern: "pinch", side: 1 });
    list.push({ t: 7.6, kind: "drone", x: W - 30, pattern: "pinch", side: -1 });

    // Diagonal charges
    list.push({ t: 9.0, kind: "fighter", x: 20, pattern: "diag", dir: 1 });
    list.push({ t: 9.4, kind: "fighter", x: W - 20, pattern: "diag", dir: -1 });

    // More pressure on later waves
    if (n >= 4) list.push({ t: 10.8, kind: "saucer", x: W * 0.25, pattern: "weave", times: 2 });
    if (n >= 5) list.push({ t: 11.6, kind: "heavy", x: W / 2, pattern: "drop" });

    // Wave finale: boss on wave 4, then every 4th wave
    if (n % 4 === 0) {
      list.push({ t: 13.0, kind: "boss", x: W / 2, pattern: "boss" });
    } else {
      // Flurry finale otherwise
      for (let i = 0; i < 4; i++) {
        list.push({ t: 12.5 + i * 0.3, kind: "drone", x: 20 + R() * (W - 40), pattern: "line", count: 2 });
      }
    }

    list.sort((a, b) => a.t - b.t);
    return list;
  }

  // Expand a single spawn directive into living enemies.
  function activateSpawn(d) {
    function mk(kind, x, y, pattern, extra) {
      const t = ENEMY_TYPES[kind];
      const hp = t.isBoss ? t.hp + game.wave * 6 : t.hp + Math.floor(game.wave / 3);
      game.enemies.push({
        kind, pattern,
        x, y: y !== undefined ? y : -30,
        w: t.w, h: t.h, r: t.r,
        hp, maxHp: hp,
        speed: t.speed * (1 + game.wave * 0.03),
        score: t.score,
        shootChance: t.shoot,
        fireCd: 1 + Math.random() * 2,
        color: t.color,
        isBoss: !!t.isBoss,
        phase: 0, t: 0, baseX: null,
        dir: (extra && extra.dir) || 1,
        side: (extra && extra.side) || 0,
        flash: 0,
      });
    }

    const p = d.pattern || "drive";
    if (p === "line") {
      for (let i = 0; i < (d.count || 2); i++) mk(d.kind, d.x + i * 28, -26, p);
    } else if (p === "vform") {
      const n = d.count || 5;
      for (let i = 0; i < n; i++) {
        const off = i - (n - 1) / 2;
        mk(d.kind, W / 2 + off * 30, -30 - Math.abs(off) * 24, "drop");
      }
    } else if (p === "pinch") {
      for (let i = 0; i < 3; i++) mk(d.kind, d.x, -30 - i * 18, p);
    } else if (p === "sine" || p === "weave") {
      const times = d.times || 1;
      for (let i = 0; i < times; i++) mk(d.kind, (d.x + i * 60) % W, -30, p);
    } else if (p === "diag") {
      mk(d.kind, d.x, -30, p, d);
      mk(d.kind, d.x, -90, p, d);
    } else if (p === "boss") {
      mk("boss", W / 2, -70, "boss");
    } else {
      mk(d.kind, d.x, -30, p, d);
    }
  }

  /* ============================================================
     ENEMY UPDATE (movement patterns + shooting)
     ============================================================ */
  function updateEnemies(dt) {
    for (let i = game.enemies.length - 1; i >= 0; i--) {
      const e = game.enemies[i];
      e.t += dt;
      e.phase += dt;
      if (e.flash > 0) e.flash -= dt;

      let removed = false;

      switch (e.pattern) {
        case "drop":
        case "drive":
        case "line":
          e.y += e.speed * dt;
          e.x += Math.sin(e.phase * 1.5) * 20 * dt;
          if (e.y > H + 40) removed = true;
          break;
        case "sine":
          e.y += e.speed * 0.8 * dt;
          if (e.baseX === null) e.baseX = e.x;
          e.x = e.baseX + Math.sin(e.phase * 2) * 60;
          if (e.y > H + 40) removed = true;
          break;
        case "weave":
          e.y += e.speed * 0.9 * dt;
          e.x += Math.sin(e.phase * 3) * 90 * dt;
          if (e.x < 15) e.x = 15;
          if (e.x > W - 15) e.x = W - 15;
          if (e.y > H + 40) removed = true;
          break;
        case "pinch":
          e.y += e.speed * 1.5 * dt;
          e.x += (W / 2 - e.x) * 0.6 * dt;
          if (e.y > H + 40) removed = true;
          break;
        case "diag":
          e.y += e.speed * 1.1 * dt;
          e.x += e.speed * 0.35 * dt * e.dir;
          if (e.y > H + 40) removed = true;
          break;
        case "boss":
          if (e.y < 130) {
            e.y += e.speed * 0.6 * dt;
          } else {
            e.x = W / 2 + Math.sin(e.phase * 0.7) * (W * 0.32);
            e.y += Math.sin(e.phase * 1.9) * 26 * dt;
            e.y = Math.max(80, Math.min(250, e.y));
          }
          if (e.y > H + 60) removed = true;
          break;
        default:
          e.y += e.speed * dt;
          if (e.y > H + 40) removed = true;
      }

      // Enemy shooting (skip drones that can't shoot)
      if (!removed && e.shootChance > 0 && e.y > 20 && e.y < H - 110) {
        e.fireCd -= dt;
        if (e.fireCd <= 0) {
          enemyFire(e);
          e.fireCd = e.isBoss ? 1.0 + Math.random() * 0.5 : 1.8 + Math.random() * 2.2;
        }
      }

      if (removed) game.enemies.splice(i, 1);
    }
  }

  function enemyFire(e) {
    const p = game.player;
    const dx = p.x - e.x;
    const dy = p.y - e.y;
    const base = Math.atan2(dy, dx);
    const spd = e.isBoss ? 195 : 175;

    if (e.isBoss) {
      // Boss fires a 5-way fan every shot
      for (const off of [-0.5, -0.25, 0, 0.25, 0.5]) {
        game.enemyBullets.push({
          x: e.x, y: e.y + e.h / 2 - 6, w: 7, h: 11,
          vx: Math.cos(base + off) * spd,
          vy: Math.sin(base + off) * spd,
          fromEnemy: true,
        });
      }
    } else {
      // Single aimed shot with slight inaccuracy
      const jit = (Math.random() - 0.5) * 0.18;
      game.enemyBullets.push({
        x: e.x, y: e.y, w: 6, h: 10,
        vx: Math.cos(base + jit) * spd,
        vy: Math.sin(base + jit) * spd,
        fromEnemy: true,
      });
    }
    spawnFlash(e.x, e.y + e.h / 2, "#ff8a5c", 7);
  }

  /* ============================================================
     COLLISION DETECTION
     ============================================================ */
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const nx = Math.max(rx, Math.min(cx, rx + rw));
    const ny = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - nx, dy = cy - ny;
    return (dx * dx + dy * dy) <= r * r;
  }

  // Player bullets vs enemies
  function collidePlayerBullets(dt) {
    for (let i = game.bullets.length - 1; i >= 0; i--) {
      const b = game.bullets[i];
      b.y += b.vy * dt;
      if (b.y < -20) { game.bullets.splice(i, 1); continue; }

      let hit = false;
      for (let j = game.enemies.length - 1; j >= 0; j--) {
        const e = game.enemies[j];
        if (circleRect(b.x, b.y, 4, e.x - e.w / 2, e.y - e.h / 2, e.w, e.h)) {
          e.hp -= b.dmg;
          hit = true;
          spawnExplosion(b.x, b.y, "#bdf0ff", 2, 45, 0.15);
          if (e.hp <= 0) {
            killEnemy(j);
          } else {
            e.flash = 0.08;
          }
          break;
        }
      }
      if (hit) game.bullets.splice(i, 1);
    }
  }

  // Enemy bullets vs player
  function collideEnemyBullets(dt) {
    const p = game.player;
    if (!p.alive) return;
    for (let i = game.enemyBullets.length - 1; i >= 0; i--) {
      const b = game.enemyBullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
        game.enemyBullets.splice(i, 1); continue;
      }
      if (circleRect(b.x, b.y, 5, p.x - p.w / 2, p.y - p.h / 2, p.w, p.h)) {
        game.enemyBullets.splice(i, 1);
        playerHit();
        break;
      }
    }
  }

  // Player body collision with enemies
  function collidePlayerVsEnemies() {
    const p = game.player;
    if (!p.alive || p.invuln > 0) return;
    for (let i = game.enemies.length - 1; i >= 0; i--) {
      const e = game.enemies[i];
      if (circleRect(p.x, p.y, p.w * 0.4, e.x - e.w / 2, e.y - e.h / 2, e.w, e.h)) {
        killEnemy(i);   // ramming destroys the enemy
        playerHit();
        break;
      }
    }
  }

  // Collect power-ups
  function collidePowerups(dt) {
    const p = game.player;
    if (!p.alive) return;
    for (let i = game.powerups.length - 1; i >= 0; i--) {
      const pu = game.powerups[i];
      pu.y += pu.vy * dt;
      pu.ttl -= dt;
      pu.bob += dt * 3;
      if (pu.ttl <= 0 || pu.y > H + 30) { game.powerups.splice(i, 1); continue; }
      if (rectHit(p, pu)) { collectPowerup(pu.type); game.powerups.splice(i, 1); }
    }
  }

  function rectHit(a, b) {
    const halfA = a.w / 2, halfB = b.w / 2;
    return Math.abs(a.x - b.x) < halfA + halfB &&
           Math.abs(a.y - b.y) < a.h / 2 + b.h / 2;
  }

  function collectPowerup(type) {
    const p = game.player;
    spawnFlash(p.x, p.y, POWERUPS.find(t => t.id === type).color, 12);
    switch (type) {
      case "weapon":
        if (p.level < 3) {
          p.level++;
          showToast("Weapon upgraded!");
        } else {
          addScore(500);
          showToast("Weapon maxed! +500");
        }
        break;
      case "shield":
        p.shield = 6;   // 6s of shield
        showToast("Shield active!");
        break;
      case "life":
        game.lives = Math.min(6, game.lives + 1);
        showToast("Extra life!");
        break;
    }
  }

  /* ============================================================
     DAMAGE / DEATH / SCORING
     ============================================================ */
  function addScore(n) {
    game.score += n;
  }

  function killEnemy(index) {
    const e = game.enemies[index];
    game.enemies.splice(index, 1);
    game.stats.kills++;

    addScore(e.score);
    game.shake = Math.max(game.shake, e.isBoss ? 14 : 6);

    // Explosion with enemy's color
    const cols = [e.color, "#ffffff", "#ffb26b"];
    if (e.isBoss) {
      spawnExplosion(e.x, e.y, cols, 90, 260, 1.1);
      for (let k = 0; k < 3; k++) spawnFlash(e.x, e.y, cols, 30);
    } else {
      spawnExplosion(e.x, e.y, cols, 22, 160, 0.55);
      spawnFlash(e.x, e.y, "#ffffff", 16);
    }

    // Chance to drop a power-up
    dropPowerup(e);
  }

  function killEnemyByKindList() {
    // Helper for loop-correct removal (not used directly).
  }

  function dropPowerup(e) {
    let roll = Math.random();
    if (e.isBoss) {
      // Boss guaranteed to drop weapon + maybe shield/life
      spawnPowerup(e.x, e.y, "weapon");
      if (Math.random() < 0.5) spawnPowerup(e.x + 30, e.y + 10, "shield");
      if (Math.random() < 0.3) spawnPowerup(e.x - 30, e.y + 10, "life");
      return;
    }
    const r = Math.random();
    if (r < 0.06) spawnPowerup(e.x, e.y, "weapon");
    else if (r < 0.12) spawnPowerup(e.x, e.y, "shield");
    else if (r < 0.15) spawnPowerup(e.x, e.y, "life");
  }

  function spawnPowerup(x, y, typeId) {
    const t = POWERUPS.find(p => p.id === typeId) || POWERUPS[0];
    game.powerups.push({ x, y, w: 22, h: 22, type: t, vy: 90, ttl: 9, bob: Math.random() * 6.28 });
  }

  function playerHit() {
    const p = game.player;
    if (p.invuln > 0 || !p.alive) return;

    if (p.shield > 0) {
      // Shield absorbs one hit
      p.shield = 0;
      p.invuln = 1.0;
      spawnExplosion(p.x, p.y, "#58d6ff", 18, 180, 0.4);
      spawnFlash(p.x, p.y, "#58d6ff", 24);
      game.shake = Math.max(game.shake, 6);
      showToast("Shield absorbed hit!");
      return;
    }

    game.stats.hitsTaken++;
    game.lives--;
    game.flashTimer = 0.4;
    game.shake = Math.max(game.shake, 10);
    spawnExplosion(p.x, p.y, ["#ff5b6a", "#ffb26b", "#ffffff"], 26, 200, 0.6);

    if (game.lives <= 0) {
      // Game over
      p.alive = false;
      spawnExplosion(p.x, p.y, ["#ff5b6a", "#ffd54a", "#ffffff"], 60, 260, 1.0);
      spawnFlash(p.x, p.y, "#ffffff", 40);
      game.shake = 20;
      gameOver();
    } else {
      // Respawn with invulnerability and reset weapon level to 1
      p.invuln = 2.0;
      p.level = 1;
      p.x = W / 2;
      p.y = H - 70;
      playerLives = game.lives; // UI marker
      showToast("Respawned");
    }
  }
  let playerLives = 3; // UI mirror (defined for update binding)

  function gameOver() {
    game.state = "over";
    const prev = highScore;
    saveHighScore();
    game.newRecord = game.score > prev && game.score > 0;
    renderGameOver();
  }

  function startGame() {
    game.autoplay = !!document.getElementById("switch-autoplay")?.checked;
    resetGame();
    game.state = "playing";
    game.wave = 1;
    game.waveTimer = 1.2;
    game.waveBanner = 2.0;
    game.spawnQueue = buildWave(1);
    showToast("Wave 1");
    updateOverlays();
  }

  /* ---- AUTOPLAY toggle ---- */
  function toggleAutoplay() {
    game.autoplay = !game.autoplay;
    const sw = document.getElementById("switch-autoplay");
    const lbl = document.getElementById("label-autoplay");
    if (sw) sw.checked = game.autoplay;
    if (game.autoplay) {
      showToast("AUTOPLAY ON");
    } else {
      showToast("AUTOPLAY OFF");
    }
    updateAutoplayLabel();
  }

  function updateAutoplayLabel() {
    const sw = document.getElementById("switch-autoplay");
    const lbl = document.getElementById("label-autoplay");
    if (!sw || !lbl) return;
    lbl.classList.toggle("on", sw.checked);
  }

  function nextWave() {
    game.wave++;
    game.waveBanner = 2.0;
    game.spawnQueue = buildWave(game.wave);
    showToast("Wave " + game.wave);
  }

  // Toast message display (floating text)
  let toastMsg = "";
  let toastTimer = 0;
  function showToast(msg) {
    toastMsg = msg;
    toastTimer = 2.0;
  }

  /* ============================================================
     MAIN UPDATE LOOP
     ============================================================ */
  function update(dt) {
    if (toastTimer > 0) toastTimer -= dt;
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 40);
    if (game.flashTimer > 0) game.flashTimer -= dt;
    if (game.waveBanner > 0) game.waveBanner -= dt;

    if (game.state === "playing") {
      updatePlayer(dt);

      // --- Wave progression / spawning ---
      if (game.spawnQueue.length === 0 && game.enemies.length === 0) {
        game.waveTimer -= dt;
        if (game.waveTimer <= 0) nextWave();
      } else {
        game.waveTimer = 1.5; // keep buffer
      }

      // Activate queued spawns whose time has come (relative to wave start)
      for (let i = game.spawnQueue.length - 1; i >= 0; i--) {
        const s = game.spawnQueue[i];
        s.t -= dt;
        if (s.t <= 0) {
          activateSpawn(s);
          game.spawnQueue.splice(i, 1);
        }
      }

      updateEnemies(dt);
      updatePowerups(dt);
      collidePlayerBullets(dt);
      collideEnemyBullets(dt);
      collidePlayerVsEnemies();
      collidePowerups(dt);
      updateBullets(dt);
    }
  }

  function updatePowerups(dt) {
    // Power-up movement handled in collidePowerups; here for generic motion.
    for (let i = game.powerups.length - 1; i >= 0; i--) {
      const pu = game.powerups[i];
      pu.bob += dt * 3;
    }
  }

  function updateBullets(dt) {
    // Off-screen cleanup for enemy bullets handled in collide; keep player bullets moving.
    // (Movement done in collision passes; nothing extra needed.)
  }

  /* ============================================================
     RENDERING
     ============================================================ */
  function render() {
    // Apply screen shake offset
    let sx = 0, sy = 0;
    if (game.shake > 0) {
      sx = (Math.random() - 0.5) * game.shake;
      sy = (Math.random() - 0.5) * game.shake;
    }
    ctx.save();
    ctx.translate(sx, sy);

    // Background
    ctx.fillStyle = "#0a0f1c";
    ctx.fillRect(-4, -4, W + 8, H + 8);

    drawStars();
    drawPowerups();
    drawEnemies();
    drawEnemyBullets();
    drawPlayer();
    drawPlayerBullets();
    drawParticles();

    ctx.restore();

    // Screen flash (damage taken / boss)
    if (game.flashTimer > 0) {
      ctx.fillStyle = "rgba(255, 40, 60, " + (game.flashTimer * 0.4) + ")";
      ctx.fillRect(0, 0, W, H);
    }

    drawHUD();

    if (toastTimer > 0) drawToast();

    // Wave banner
    if (game.waveBanner > 0 && game.state === "playing") {
      const a = Math.min(1, game.waveBanner);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 44px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("WAVE " + game.wave, W / 2, H * 0.35);
      ctx.globalAlpha = 1;
      ctx.textAlign = "left";
    }
  }

  /* ============================================================
     DRAWING HELPERS
     ============================================================ */
  function drawStars() {
    for (const st of game.stars) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(game.time * 3 + st.tw);
      ctx.fillStyle = "#8fb7e8";
      ctx.fillRect(st.x, st.y, st.size, st.size);
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    const p = game.player;
    if (!p.alive) return;
    // Blink while invulnerable
    if (p.invuln > 0 && Math.floor(game.time * 12) % 2 === 0) {
      ctx.globalAlpha = 0.35;
    }

    ctx.save();
    ctx.translate(p.x, p.y);

    // Engine flame
    ctx.fillStyle = "#ffd54a";
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(game.time * 30);
    ctx.beginPath();
    ctx.moveTo(-5, 16);
    ctx.lineTo(5, 16);
    ctx.lineTo(0, 16 + 10 + Math.random() * 6);
    ctx.closePath();
    ctx.fill();

    // Body (main fuselage)
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(9, -4);
    ctx.lineTo(15, 14);
    ctx.lineTo(4, 12);
    ctx.lineTo(0, 17);
    ctx.lineTo(-4, 12);
    ctx.lineTo(-15, 14);
    ctx.lineTo(-9, -4);
    ctx.closePath();

    const grad = ctx.createLinearGradient(-15, 0, 15, 0);
    grad.addColorStop(0, "#5b7fbf");
    grad.addColorStop(0.5, "#aad0ff");
    grad.addColorStop(1, "#5b7fbf");
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = "#cfe6ff";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Canopy
    ctx.fillStyle = "rgba(180, 230, 255, 0.85)";
    ctx.beginPath();
    ctx.ellipse(0, -8, 4, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wings
    ctx.fillStyle = "#4a6aa8";
    ctx.beginPath();
    ctx.moveTo(-2, 0); ctx.lineTo(-20, 6); ctx.lineTo(-18, 12); ctx.lineTo(-3, 9);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(2, 0); ctx.lineTo(20, 6); ctx.lineTo(18, 12); ctx.lineTo(3, 9);
    ctx.closePath(); ctx.fill();

    // Wing tips
    ctx.fillStyle = "#ff6b6b";
    ctx.fillRect(-21, 6, 3, 6);
    ctx.fillRect(18, 6, 3, 6);

    ctx.restore();

    // Shield ring
    if (p.shield > 0) {
      ctx.strokeStyle = "rgba(88, 214, 255, " + (0.5 + 0.3 * Math.sin(game.time * 6)) + ")";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w * 0.75, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "rgba(88, 214, 255, 0.15)";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.w * 0.75, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayerBullets() {
    for (const b of game.bullets) {
      const grad = ctx.createLinearGradient(b.x, b.y + b.h, b.x, b.y);
      grad.addColorStop(0, "rgba(88,214,255,0)");
      grad.addColorStop(0.4, "#58d6ff");
      grad.addColorStop(1, "#eafcff");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(b.x, b.y, 3, b.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawEnemyBullets() {
    for (const b of game.enemyBullets) {
      ctx.fillStyle = "#ff7b5c";
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.beginPath();
      ctx.ellipse(0, 0, b.w / 2, b.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawEnemies() {
    for (const e of game.enemies) {
      ctx.save();
      ctx.translate(e.x, e.y);

      // Flash white when hit
      if (e.flash > 0) {
        ctx.globalAlpha = 1;
        ctx.filter = "brightness(2.2)";
      }

      if (e.isBoss) drawBoss(e);
      else drawEnemy(e);

      ctx.filter = "none";
      ctx.restore();

      // Health bar for damaged non-boss
      if (!e.isBoss && e.hp < e.maxHp) {
        const w = e.w;
        const pct = e.hp / e.maxHp;
        ctx.fillStyle = "rgba(20,20,30,0.7)";
        ctx.fillRect(e.x - w / 2, e.y - e.h / 2 - 6, w, 3);
        ctx.fillStyle = "#7dffb0";
        ctx.fillRect(e.x - w / 2, e.y - e.h / 2 - 6, w * pct, 3);
      }
    }
  }

  function drawEnemy(e) {
    // Generic enemy jet
    const cols = e.color;
    ctx.fillStyle = cols;
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    ctx.lineWidth = 1;

    // Body
    ctx.beginPath();
    ctx.moveTo(0, e.h / 2);
    ctx.lineTo(e.w / 2 - 2, -4);
    ctx.lineTo(e.w / 2, -e.h / 2 + 2);
    ctx.lineTo(0, -e.h / 2 + 6);
    ctx.lineTo(-e.w / 2, -e.h / 2 + 2);
    ctx.lineTo(-e.w / 2 + 2, -4);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cockpit dot
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.beginPath();
    ctx.ellipse(0, -2, 3, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Flame
    ctx.fillStyle = "rgba(255,140,60,0.8)";
    ctx.beginPath();
    ctx.moveTo(-5, e.h / 2);
    ctx.lineTo(5, e.h / 2);
    ctx.lineTo(0, e.h / 2 + 8 + Math.random() * 5);
    ctx.closePath();
    ctx.fill();
  }

  function drawBoss(e) {
    // Big hostile warship
    const pulse = 0.6 + 0.4 * Math.sin(game.time * 4);
    ctx.fillStyle = "#3a1420";
    ctx.strokeStyle = "#ff4d4d";
    ctx.lineWidth = 2;

    // Hull
    ctx.beginPath();
    ctx.moveTo(0, -e.h / 2);
    ctx.lineTo(e.w / 2, -e.h / 2 + 14);
    ctx.lineTo(e.w / 2, e.h / 2 - 4);
    ctx.lineTo(0, e.h / 2);
    ctx.lineTo(-e.w / 2, e.h / 2 - 4);
    ctx.lineTo(-e.w / 2, -e.h / 2 + 14);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Cockpit band
    ctx.strokeStyle = "#ff4d4d";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-e.w / 2 + 10, -6);
    ctx.lineTo(e.w / 2 - 10, -6);
    ctx.stroke();

    // Core glow
    ctx.fillStyle = "rgba(255,80,80," + pulse + ")";
    ctx.beginPath();
    ctx.arc(0, 8, 8, 0, Math.PI * 2);
    ctx.fill();

    // Side cannons
    ctx.fillStyle = "#5a1a1a";
    ctx.fillRect(-e.w / 2 - 4, -4, 8, 14);
    ctx.fillRect(e.w / 2 - 4, -4, 8, 14);

    // HP bar above boss
    const bw = W * 0.6;
    const bx = W / 2 - bw / 2;
    const by = e.y - e.h / 2 - 14;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(bx - 2, by - 2, bw + 4, 8);
    ctx.fillStyle = "#3a1420";
    ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = "#ff4d4d";
    ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), 4);
    ctx.strokeStyle = "rgba(255,77,77,0.5)";
    ctx.lineWidth = 1;
    ctx.strokeRect(bx - 2, by - 2, bw + 4, 8);
  }

  function drawPowerups() {
    for (const pu of game.powerups) {
      const bobY = pu.y + Math.sin(pu.bob) * 3;
      // Glow
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(pu.bob * 2);
      ctx.fillStyle = pu.type.color;
      ctx.beginPath();
      ctx.arc(pu.x, bobY, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Badge
      ctx.fillStyle = "rgba(8,12,24,0.9)";
      ctx.strokeStyle = pu.type.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pu.x, bobY, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = pu.type.color;
      ctx.font = "bold 14px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(pu.type.char, pu.x, bobY + 1);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }
  }

  function drawParticles() {
    for (const p of game.particles) {
      const a = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = a;
      if (p.flash) {
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size + (1 - a) * 26, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = a * 0.5;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     HUD
     ============================================================ */
  function drawHUD() {
    ctx.fillStyle = "rgba(6, 10, 20, 0.55)";
    ctx.fillRect(0, 0, W, 44);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px 'Segoe UI', sans-serif";
    ctx.textBaseline = "middle";

    // Score (left)
    ctx.textAlign = "left";
    ctx.fillStyle = "#ffd54a";
    ctx.fillText("SCORE", 12, 19);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px 'Segoe UI', sans-serif";
    ctx.fillText(game.score.toLocaleString(), 78, 19);

    // Lives (center) — little plane icons
    ctx.textAlign = "left";
    ctx.font = "14px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#58d6ff";
    for (let i = 0; i < Math.max(0, game.lives); i++) {
      drawMiniPlane(196 + i * 18, 22);
    }
    ctx.textAlign = "left";

    // Wave (right)
    ctx.font = "bold 16px 'Segoe UI', sans-serif";
    ctx.fillStyle = "#c58cff";
    ctx.textAlign = "right";
    ctx.fillText("WAVE " + game.wave, W - 12, 22);
    ctx.textAlign = "left";

    ctx.textBaseline = "alphabetic";
  }

  function drawMiniPlane(x, y) {
    ctx.fillStyle = "#58d6ff";
    ctx.beginPath();
    ctx.moveTo(x, y - 6);
    ctx.lineTo(x + 5, y + 2);
    ctx.lineTo(x + 8, y + 5);
    ctx.lineTo(x + 2, y + 4);
    ctx.lineTo(x, y + 6);
    ctx.lineTo(x - 2, y + 4);
    ctx.lineTo(x - 8, y + 5);
    ctx.lineTo(x - 5, y + 2);
    ctx.closePath();
    ctx.fill();
  }

  function drawToast() {
    const a = Math.min(1, toastTimer);
    ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(8,12,24,0.75)";
    const w = 260;
    ctx.beginPath();
    ctx.roundRect(W / 2 - w / 2, H * 0.2, w, 38, 19);
    ctx.fill();
    ctx.fillStyle = "#9be4ff";
    ctx.font = "bold 15px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(toastMsg, W / 2, H * 0.2 + 19);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.globalAlpha = 1;
  }

  /* ============================================================
     OVERLAY SCREENS (DOM) — start, pause, game-over
     ============================================================ */
  let overlays = {};

  function buildOverlays() {
    // Start menu
    const start = document.createElement("div");
    start.className = "overlay";
    start.id = "startOverlay";
    start.innerHTML =
      '<div><h1>SKY STRIKER</h1>' +
      '<div class="sub">VERTICAL SHOOTER</div>' +
      '<div class="btn" data-start>START</div>' +
      '<div class="switch-row">' +
      '<span class="switch-label" id="label-autoplay">AUTOPLAY DEMO</span>' +
      '<label class="switch"><input type="checkbox" id="switch-autoplay" /><span class="slider"></span></label>' +
      '</div>' +
      '<div class="auto-hint">Toggle autoplay to watch the AI play itself (HOTKEY A)</div>' +
      '<div class="controls-hint">' +
      '<b>Move:</b> Arrow Keys / WASD · <b>Fire:</b> Space<br>' +
      '<b>Mouse:</b> Click &amp; drag · <b>Touch:</b> Drag to move + auto-fire<br>' +
      '<b>Pause:</b> P / Esc' +
      '</div>' +
      '<div class="high-label">BEST — ' + game.currentHigh.toLocaleString() + '</div>' +
      '</div>';
    GAME.appendChild(start);

    // Pause menu
    const pause = document.createElement("div");
    pause.className = "overlay hidden";
    pause.id = "pauseOverlay";
    pause.innerHTML =
      '<div><h1 style="font-size:34px">PAUSED</h1>' +
      '<div class="sub">TAP P / ESC TO RESUME</div>' +
      '<div class="btn" data-resume>RESUME</div>' +
      '<div class="btn ghost" data-restart>RESTART</div>' +
      '</div>';
    GAME.appendChild(pause);

    // Game-over menu
    const over = document.createElement("div");
    over.className = "overlay hidden";
    over.id = "overOverlay";
    over.innerHTML =
      '<div><h1 style="font-size:40px">GAME OVER</h1>' +
      '<div class="sub">THE SKIES CLAIM ANOTHER</div>' +
      '<div class="score-final" id="finalScore">0</div>' +
      '<div class="score-label">FINAL SCORE</div>' +
      '<div id="newRecord" class="new-record" style="display:none">★ NEW HIGH SCORE ★</div>' +
      '<div class="high-label" id="highLine">BEST — 0</div>' +
      '<div class="stats-row">' +
      '<div>MAX WAVE <b class="st-wave">1</b></div>' +
      '<div>KILLS <b class="st-kills">0</b></div>' +
      '</div>' +
      '<div class="btn" data-restart2>PLAY AGAIN</div>' +
      '<div class="btn ghost" data-menu>MAIN MENU</div>' +
      '</div>';
    GAME.appendChild(over);

    overlays = {
      start, pause, over,
    };

    // Wire buttons
    const q = (sel) => GAME.querySelector(sel);
    const startBtn = q("#startOverlay [data-start]");
    const resumeBtn = q("#pauseOverlay [data-resume]");
    const restartBtn = q("#pauseOverlay [data-restart]");
    const playAgain = q("#overOverlay [data-restart2]");
    const menuBtn = q("#overOverlay [data-menu]");

    startBtn.addEventListener("click", startGame);
    const autoSwitch = q("#startOverlay #switch-autoplay");
    if (autoSwitch) {
      autoSwitch.addEventListener("change", () => {
        game.autoplay = autoSwitch.checked;
        updateAutoplayLabel();
      });
    }
    resumeBtn.addEventListener("click", () => {
      game.state = "playing"; updateOverlays();
    });
    restartBtn.addEventListener("click", startGame);
    playAgain.addEventListener("click", startGame);
    menuBtn.addEventListener("click", () => {
      game.state = "menu"; updateOverlays();
      updateMenuHUD();
    });
  }

  function updateOverlays() {
    overlays.start.classList.toggle("hidden", game.state !== "menu");
    overlays.pause.classList.toggle("hidden", game.state !== "paused");
    overlays.over.classList.toggle("hidden", game.state !== "over");
  }

  function updateMenuHUD() {
    // refresh best score shown on menu
    const hi = GAME.querySelector("#startOverlay .high-label");
    if (hi) hi.textContent = "BEST — " + game.currentHigh.toLocaleString();
  }

  function renderGameOver() {
    const q = (sel) => GAME.querySelector(sel);
    q("#finalScore").textContent = game.score.toLocaleString();
    q("#highLine").textContent = "BEST — " + game.currentHigh.toLocaleString();
    q("#newRecord").style.display = game.newRecord ? "block" : "none";
    q("#overOverlay .st-wave").textContent = game.wave;
    q("#overOverlay .st-kills").textContent = game.stats.kills;
    updateOverlays();
  }

  /* ============================================================
     GAME LOOP (requestAnimationFrame + fixed timestep)
     ============================================================ */
  let lastTime = performance.now();
  let accumulator = 0;
  const FIXED_DT = 1 / 60;

  function frame(now) {
    // Timestep: clamp large gaps (e.g. tab switch) to avoid physics jumps
    let delta = (now - lastTime) / 1000;
    lastTime = now;
    if (delta > 0.25) delta = 0.25;

    // If not playing, we still animate the menu background at full rate.
    // Use simple variable timestep while in play, but keep it stable.
    accumulator += delta;
    if (accumulator > 0.25) accumulator = 0.25;

    // Update at fixed steps for physics consistency.
    let steps = Math.floor(accumulator / FIXED_DT);
    accumulator -= steps * FIXED_DT;
    if (steps > 5) steps = 5;

    // Background animates even in menus.
    for (let i = 0; i < steps; i++) {
      game.time += FIXED_DT;
      updateStarfield(FIXED_DT);
      updateParticles(FIXED_DT);
      if (game.state === "playing") update(FIXED_DT);
    }

    // Always render every frame.
    render();
    requestAnimationFrame(frame);
  }

  /* ============================================================
     BOOTSTRAP
     ============================================================ */
  buildOverlays();
  resetGame();               // set sane defaults
  updateOverlays();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
