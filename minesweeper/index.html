<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minesweeper</title>
    <style>
        :root {
            --bg:              #10141a;
            --panel:           #1a2027;
            --panel-border:    #2a323c;
            --cell-hidden:     #2a3542;
            --cell-hidden-2:   #1b2531;
            --cell-hidden-hov: #33404f;
            --cell-revealed:   #141a20;
            --cell-border:     #27303b;
            --text:            #dbe4ee;
            --text-dim:        #8b98a5;
            --text-bright:     #ffffff;
            --accent:          #4f9cf9;
            --accent-hover:    #6ab0ff;
            --success:         #35c485;
            --danger:          #ff5c5c;
            --mine:            #ff4d4d;
            --gold:            #ffd166;
            --n1: #4f9cf9;
            --n2: #35c485;
            --n3: #ff6b6b;
            --n4: #9b7bff;
            --n5: #ff9f43;
            --n6: #40c0c0;
            --n7: #e0e0e0;
            --n8: #ff6f91;
            --cell: 34px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: radial-gradient(1200px 800px at 50% -10%, #1b2531 0%, var(--bg) 60%);
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: contain;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 18px 12px;
            width: 100%;
            max-width: 100vw;
        }

        header.site-header { display: flex; align-items: center; gap: 10px; padding: 2px 6px; }
        .site-title {
            font-size: 22px; font-weight: 800; letter-spacing: 1.5px;
            color: var(--text-bright);
            text-shadow: 0 0 22px rgba(79,156,249,0.35);
        }
        .site-title .boom { display: inline-block; animation: boompulse 2.4s ease-in-out infinite; }
        .site-sub { font-size: 11px; color: var(--text-dim); letter-spacing: 0.6px; }
        @keyframes boompulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }

        .panel {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; width: 100%; max-width: 600px; padding: 10px 14px;
            background: linear-gradient(180deg, #1d262f 0%, var(--panel) 100%);
            border: 1px solid var(--panel-border); border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.30);
        }
        .stat { display: flex; flex-direction: column; align-items: center; min-width: 54px; }
        .stat .label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); }
        .stat .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-bright); }
        .stat .value.mines-remaining { color: var(--danger); }
        .stat .value.timer         { color: var(--accent); }
        .stat .value.best          { color: var(--gold); }

        .difficulty { display: flex; gap: 5px; padding: 5px; background: var(--bg); border: 1px solid var(--panel-border); border-radius: 10px; }
        .difficulty button {
            padding: 6px 13px; border: none; border-radius: 7px; background: transparent;
            color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .difficulty button:hover { color: var(--text); }
        .difficulty button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .difficulty button.active { background: var(--accent); color: #0c1016; }

        .restart-btn {
            padding: 9px 18px; border: none; border-radius: 10px;
            background: linear-gradient(180deg, var(--accent-hover), var(--accent));
            color: #0c1016; font-size: 14px; font-weight: 800; cursor: pointer;
            transition: transform 0.06s, box-shadow 0.2s, filter 0.15s;
            box-shadow: 0 4px 14px rgba(79,156,249,0.25);
        }
        .restart-btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,156,249,0.4); }
        .restart-btn:active { transform: scale(0.96); }
        .restart-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .board {
            display: grid; gap: 2px; padding: 8px;
            background: linear-gradient(180deg, #202a34 0%, var(--panel) 100%);
            border: 1px solid var(--panel-border); border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.40);
            touch-action: manipulation;
        }
        .board:focus { outline: none; }
        .board:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        .cell {
            width: var(--cell); height: var(--cell);
            display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--cell) * 0.46); font-weight: 700; cursor: pointer;
            border-radius: 3px; position: relative;
            transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .cell.hidden {
            background: linear-gradient(180deg, var(--cell-hidden) 0%, var(--cell-hidden-2) 100%);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.55),
                        inset 2px 2px 4px rgba(255,255,255,0.10);
        }
        .cell.hidden:hover {
            background: linear-gradient(180deg, var(--cell-hidden-hov) 0%, var(--cell-hidden-2) 100%);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.55),
                        inset 2px 2px 4px rgba(255,255,255,0.10),
                        0 0 12px rgba(79,156,249,0.35);
        }
        .cell:active { transform: scale(0.92); }
        .cell.revealed {
            background: var(--cell-revealed); cursor: default;
            box-shadow: inset 2px 2px 4px rgba(0,0,0,0.55),
                        inset -1px -1px 2px rgba(255,255,255,0.03);
            border-color: rgba(0,0,0,0.35);
        }
        .cell.revealed:hover { background: var(--cell-revealed); }
        .cell.flag::after {
            content: "\2691"; color: var(--danger); font-size: calc(var(--cell) * 0.55);
            line-height: 1; filter: drop-shadow(0 0 4px rgba(255,92,92,0.5));
            animation: flag-pop 0.18s ease;
        }
        @keyframes flag-pop { 0% { transform: scale(0.4); } 80% { transform: scale(1.15); } 100% { transform: scale(1); } }
        .cell.mine::after { content: "\25CF"; color: var(--mine); font-size: calc(var(--cell) * 0.6); line-height: 1; }
        .cell.mine.exploded::after { content: "\1F4A5"; font-size: calc(var(--cell) * 0.7); }
        .cell.zero { color: transparent; }
        .cell.n1 { color: var(--n1); text-shadow: 0 0 6px rgba(79,156,249,0.3); }
        .cell.n2 { color: var(--n2); text-shadow: 0 0 6px rgba(53,196,133,0.3); }
        .cell.n3 { color: var(--n3); text-shadow: 0 0 6px rgba(255,107,107,0.3); }
        .cell.n4 { color: var(--n4); text-shadow: 0 0 6px rgba(155,123,255,0.3); }
        .cell.n5 { color: var(--n5); text-shadow: 0 0 6px rgba(255,159,67,0.3); }
        .cell.n6 { color: var(--n6); text-shadow: 0 0 6px rgba(64,192,192,0.3); }
        .cell.n7 { color: var(--n7); }
        .cell.n8 { color: var(--n8); text-shadow: 0 0 6px rgba(255,111,145,0.3); }
        .cell.cursor { outline: 2px solid var(--accent); outline-offset: -1px; z-index: 2; }
        .cell.reveal-pop { animation: reveal-pop 0.16s ease; }
        @keyframes reveal-pop { 0% { transform: scale(0.6); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
        .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }

        .result { font-size: 16px; font-weight: 700; min-height: 24px; letter-spacing: 0.5px; text-align: center; }
        .result.win  { color: var(--success); animation: win-bounce 0.5s ease; }
        .result.lose { color: var(--danger); animation: shake 0.4s ease; }
        @keyframes win-bounce { 0% { transform: scale(0.5); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

        .hint { font-size: 12px; color: var(--text-dim); text-align: center; line-height: 1.6; }
        .hint kbd {
            background: var(--panel); border: 1px solid var(--panel-border); border-bottom-width: 2px;
            border-radius: 4px; padding: 1px 5px; font-size: 11px; font-family: inherit; color: var(--text);
        }

        .controls {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
            width: 100%; max-width: 780px; padding: 10px 14px;
            background: linear-gradient(180deg, #1d262f 0%, var(--panel) 100%);
            border: 1px solid var(--panel-border); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,0.30);
        }
        .controls-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
        .auto-btn {
            padding: 8px 14px; border: 1px solid var(--panel-border); border-radius: 8px; background: var(--bg);
            color: var(--text-dim); font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }
        .auto-btn:hover:not(:disabled) { color: var(--text); }
        .auto-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
        .auto-btn.active { background: var(--accent); color: #0c1016; border-color: var(--accent); }
        .auto-btn.active.flag { background: var(--success); border-color: var(--success); }
        .auto-btn:disabled { opacity: 0.45; cursor: not-allowed; }

        .cust-group { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
        .cust-group label { cursor: pointer; }
        .cust-group input[type="number"] {
            width: 56px; padding: 6px 8px; border: 1px solid var(--panel-border); border-radius: 6px; background: var(--bg);
            color: var(--text); font-size: 13px; text-align: center; transition: border-color 0.15s, box-shadow 0.15s;
            -moz-appearance: textfield;
        }
        .cust-group input[type="number"]::-webkit-outer-spin-button,
        .cust-group input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .cust-group input[type="number"]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,156,249,0.25); }

        .apply-btn {
            padding: 8px 14px; border: none; border-radius: 8px;
            background: linear-gradient(180deg, var(--accent-hover), var(--accent));
            color: #0c1016; font-size: 13px; font-weight: 700; cursor: pointer;
            transition: transform 0.05s, filter 0.15s;
        }
        .apply-btn:hover { filter: brightness(1.1); }
        .apply-btn:active { transform: scale(0.96); }
        .apply-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .auto-progress { min-height: 18px; font-size: 13px; font-weight: 600; color: var(--accent); text-align: center; letter-spacing: 0.3px; }
        .progress-bar { height: 6px; width: 100%; max-width: 420px; background: var(--bg); border: 1px solid var(--panel-border); border-radius: 6px; overflow: hidden; margin: 0 auto; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--success)); border-radius: 6px; transition: width 0.1s linear; }
        .cust-error { font-size: 12px; color: var(--danger); min-height: 16px; text-align: center; }

        .best-chip { font-size: 11px; color: var(--gold); margin-top: 2px; letter-spacing: 0.4px; text-align: center; }

        #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
        .confetti-piece { position: absolute; top: -24px; width: 10px; height: 14px; opacity: 0; will-change: transform; }

        @media (max-width: 560px) {
            .panel { max-width: 100%; flex-wrap: wrap; justify-content: center; }
            .app { padding: 10px 4px; gap: 10px; }
            .site-title { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="site-header">
            <h1 class="site-title"><span class="boom">💣</span> MINESWEEPER</h1>
        </header>

        <div class="panel">
            <div class="stat">
                <span class="label">Mines</span>
                <span class="value mines-remaining" id="minesCounter">0</span>
            </div>
            <div class="difficulty" id="difficultySelector" aria-label="Difficulty">
                <button data-diff="easy">Easy</button>
                <button data-diff="medium" class="active">Medium</button>
                <button data-diff="hard">Hard</button>
            </div>
            <div class="stat">
                <span class="label">Time</span>
                <span class="value timer" id="timer">0</span>
            </div>
            <div class="stat">
                <span class="label">Best</span>
                <span class="value best" id="bestValue">--</span>
                <span class="best-chip" id="bestChip">&nbsp;</span>
            </div>
        </div>

        <div class="controls">
            <div class="controls-row">
                <button class="auto-btn" id="autoClearBtn">▶ Auto Clear</button>
                <button class="auto-btn flag" id="autoFlagBtn">⚑ Auto Flag</button>
            </div>
            <div class="controls-row">
                <span class="cust-group">
                    <label for="custWidth">Width</label>
                    <input type="number" id="custWidth" min="5" max="50" value="16">
                </span>
                <span class="cust-group">
                    <label for="custHeight">Height</label>
                    <input type="number" id="custHeight" min="5" max="50" value="16">
                </span>
                <span class="cust-group">
                    <label for="custMines">Mines</label>
                    <input type="number" id="custMines" min="1" value="40">
                </span>
                <button class="apply-btn" id="applyCustomBtn">Apply Size</button>
            </div>
            <div class="cust-error" id="custError"></div>
        </div>

        <div class="result" id="result" aria-live="polite"></div>

        <div class="board" id="board" tabindex="0" role="grid"
             aria-label="Minesweeper board. Arrow keys move, Enter reveals, F flags, D opens."></div>

        <div class="auto-progress" id="autoProgress"></div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

        <button class="restart-btn" id="restartBtn" aria-label="Start a new game">↻ New Game</button>
        <div class="hint">
            Tap / Left-click: reveal &middot; Long-press / Right-click: flag<br>
            <kbd>↑↓←→</kbd> move &middot; <kbd>Enter</kbd> reveal &middot; <kbd>F</kbd> flag &middot; <kbd>D</kbd> chord &middot; <kbd>R</kbd> restart
        </div>
    </div>

    <div id="confetti" aria-hidden="true"></div>

    <script>
        "use strict";
        /* ---------- Difficulty presets ---------- */
        const DIFFICULTIES = {
            easy:   { rows: 9,  cols: 9,  mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard:   { rows: 16, cols: 30, mines: 99 }
        };

        /* ---------- Game state ---------- */
        const state = {
            difficulty: "medium",
            rows: 0,
            cols: 0,
            mines: 0,
            grid: [],
            cellEls: [],
            revealedCount: 0,
            flagCount: 0,
            firstClick: true,
            timer: 0,
            timerInterval: null,
            gameOver: false,
            won: false,
            cursor: { r: 0, c: 0 },
            lastCustom: { rows: 16, cols: 16, mines: 40 }
        };

        const autoState = {
            active: false,
            queue: [],
            total: 0,
            interval: null,
            autoFlag: false
        };

        const press = { timeout: null, on: false, startX: 0, startY: 0 };

        const DENSITIES = {
            easy:   10 / 81,
            medium: 40 / 256,
            hard:   99 / 480
        };

        const MIN_SIZE = 5;
        const MAX_SIZE = 50;
        const LONG_PRESS_MS = 400;
        const STORAGE_KEY = "minesweeper_best_v1";

        /* ---------- DOM references ---------- */
        const boardEl         = document.getElementById("board");
        const minesEl         = document.getElementById("minesCounter");
        const timerEl         = document.getElementById("timer");
        const resultEl        = document.getElementById("result");
        const bestValueEl     = document.getElementById("bestValue");
        const bestChipEl      = document.getElementById("bestChip");
        const restartBtn      = document.getElementById("restartBtn");
        const difficultyEl    = document.getElementById("difficultySelector");
        const autoClearBtn    = document.getElementById("autoClearBtn");
        const autoFlagBtn     = document.getElementById("autoFlagBtn");
        const custWidthEl     = document.getElementById("custWidth");
        const custHeightEl    = document.getElementById("custHeight");
        const custMinesEl     = document.getElementById("custMines");
        const applyCustomBtn  = document.getElementById("applyCustomBtn");
        const custErrorEl     = document.getElementById("custError");
        const autoProgressEl  = document.getElementById("autoProgress");
        const progressFillEl  = document.getElementById("progressFill");
        const confettiEl      = document.getElementById("confetti");

        /* ==========================================================================
           Best-score persistence (localStorage per difficulty)
           ========================================================================== */
        function bestKey(difficulty, rows, cols, mines) {
            let base = difficulty;
            if (difficulty === "custom") base = "custom_" + rows + "x" + cols + "_" + mines;
            return base;
        }
        function loadBest(difficulty, rows, cols, mines) {
            try {
                const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                const rec = all[bestKey(difficulty, rows, cols, mines)];
                return rec ? { time: Number(rec.time) || Infinity, score: Number(rec.score) || 0 } : null;
            } catch (e) { return null; }
        }
        function saveBest(difficulty, rows, cols, mines, time, score) {
            try {
                const all = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
                const key = bestKey(difficulty, rows, cols, mines);
                const prev = all[key] || { time: Infinity, score: 0 };
                const betterTime = time < prev.time;
                const betterScore = score > prev.score;
                if (betterTime || betterScore) {
                    all[key] = {
                        time: betterTime ? time : prev.time,
                        score: betterScore ? score : prev.score,
                        date: new Date().toISOString()
                    };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
                    return true;
                }
                return false;
            } catch (e) { return false; }
        }
        function computeScore(time, rows, cols, mines) {
            const safeCells = rows * cols - mines;
            const t = Math.max(1, time);
            return Math.round((safeCells * (1 + mines / 100)) / t);
        }
        function updateBestDisplay() {
            const rec = loadBest(state.difficulty, state.rows, state.cols, state.mines);
            if (rec && isFinite(rec.time)) {
                bestValueEl.textContent = rec.time + "s";
                bestChipEl.textContent = bestKey(state.difficulty, state.rows, state.cols, state.mines) + " \u00b7 " + rec.score + " pts";
            } else {
                bestValueEl.textContent = "--";
                bestChipEl.textContent = bestKey(state.difficulty, state.rows, state.cols, state.mines);
            }
        }

        /* ---------- Helpers ---------- */
        function idxToCell(r, c) { return state.grid[r][c]; }
        function cellEl(r, c)    { return state.cellEls[r][c]; }
        function inBounds(r, c)  { return r >= 0 && r < state.rows && c >= 0 && c < state.cols; }
        function neighbors(r, c) {
            const res = [];
            for (let dr = -1; dr <= 1; dr++)
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    if (inBounds(r + dr, c + dc)) res.push([r + dr, c + dc]);
                }
            return res;
        }
        function flaggedNeighborCount(r, c) {
            let n = 0;
            for (const pair of neighbors(r, c)) if (idxToCell(pair[0], pair[1]).flagged) n++;
            return n;
        }

        /* ---------- Responsive cell sizing ---------- */
        function computeCellSize() {
            if (state.cols === 0 || state.rows === 0) return 34;
            const pad = 24;
            const maxW = Math.max(280, Math.min(window.innerWidth - pad, 1200));
            const maxH = Math.max(200, window.innerHeight - 280);
            let size = Math.max(8, Math.min(36, Math.floor(maxW / state.cols), Math.floor(maxH / state.rows)));
            if (size * state.cols + state.cols * 2 + 16 > window.innerWidth - 8) {
                size = Math.max(6, Math.floor((window.innerWidth - 8 - 16 - state.cols * 2) / state.cols));
            }
            return size;
        }
        function applyCellSize() {
            document.documentElement.style.setProperty("--cell", computeCellSize() + "px");
        }

        /* ---------- Board setup ---------- */
        function newGame(difficulty, override) {
            stopAutoClear();
            stopTimer();

            let cfg;
            if (difficulty === "custom") {
                const base = state.lastCustom || { rows: 16, cols: 16, mines: 40 };
                cfg = { rows: base.rows, cols: base.cols, mines: base.mines };
                state.difficulty = "custom";
            } else {
                cfg = DIFFICULTIES[difficulty];
                state.difficulty = difficulty;
            }

            state.rows = cfg.rows;
            state.cols = cfg.cols;
            state.mines = cfg.mines;

            if (difficulty === "custom" && override) {
                state.rows  = override.rows;
                state.cols  = override.cols;
                state.mines = Math.max(1, Math.min(override.mines, state.rows * state.cols - 1));
            }

            state.grid  = createEmptyGrid();
            state.cellEls = createEmptyElGrid();
            state.revealedCount = 0;
            state.flagCount = 0;
            state.firstClick = true;
            state.timer = 0;
            state.gameOver = false;
            state.won = false;
            state.cursor = { r: 0, c: 0 };

            applyCellSize();
            renderBoard();
            updateHud();
            resultEl.textContent = "";
            resultEl.className = "result";
            timerEl.textContent = "0";
            updateBestDisplay();
            updateProgress("", 0, 0);
            setActiveDifficultyButton(difficulty);
        }

        function scaledMines(rows, cols, difficulty) {
            const density = DENSITIES[difficulty] || DENSITIES.medium;
            const total = rows * cols;
            const count = Math.round(total * density);
            return Math.max(1, Math.min(count, total - 1));
        }

        function applyCustomSize() {
            const w = parseInt(custWidthEl.value, 10);
            const h = parseInt(custHeightEl.value, 10);
            let m = parseInt(custMinesEl.value, 10);
            if (isNaN(w) || isNaN(h) || w < MIN_SIZE || w > MAX_SIZE || h < MIN_SIZE || h > MAX_SIZE) {
                custErrorEl.textContent = "Width & Height must be " + MIN_SIZE + ".." + MAX_SIZE + " cells each.";
                return false;
            }
            const total = w * h;
            const scaled = scaledMines(h, w, state.difficulty);
            if (isNaN(m)) m = scaled;
            m = Math.max(1, Math.min(m, total - 1));
            if (m > total - 1 || m < 1) {
                custErrorEl.textContent = "Mines must be between 1 and " + (total - 1) + ".";
                return false;
            }
            if (custMinesEl.value.trim() === "") custMinesEl.value = scaled;
            custErrorEl.textContent = "";
            state.lastCustom = { rows: h, cols: w, mines: m };
            newGame("custom", { rows: h, cols: w, mines: m });
            return true;
        }

        function createEmptyGrid() {
            const grid = [];
            for (let r = 0; r < state.rows; r++) {
                const row = [];
                for (let c = 0; c < state.cols; c++) row.push({ mine: false, adjacent: 0, revealed: false, flagged: false });
                grid.push(row);
            }
            return grid;
        }

        function createEmptyElGrid() {
            const els = [];
            for (let r = 0; r < state.rows; r++) {
                const row = [];
                for (let c = 0; c < state.cols; c++) row.push(null);
                els.push(row);
            }
            return els;
        }

        function placeMines(safeR, safeC) {
            const protectedCells = new Set();
            protectedCells.add(safeR + "," + safeC);
            for (const pair of neighbors(safeR, safeC)) protectedCells.add(pair[0] + "," + pair[1]);

            const totalCells = state.rows * state.cols;
            const freeCells = totalCells - protectedCells.size;
            const candidates = [];
            for (let r = 0; r < state.rows; r++)
                for (let c = 0; c < state.cols; c++)
                    if (!protectedCells.has(r + "," + c)) candidates.push([r, c]);

            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const tmp = candidates[i];
                candidates[i] = candidates[j];
                candidates[j] = tmp;
            }

            const mineCount = Math.min(state.mines, freeCells);
            for (let i = 0; i < mineCount; i++) {
                const pair = candidates[i];
                idxToCell(pair[0], pair[1]).mine = true;
            }

            for (let r = 0; r < state.rows; r++)
                for (let c = 0; c < state.cols; c++) {
                    if (idxToCell(r, c).mine) continue;
                    let count = 0;
                    for (const pair of neighbors(r, c)) if (idxToCell(pair[0], pair[1]).mine) count++;
                    idxToCell(r, c).adjacent = count;
                }
        }

        /* ---------- Rendering (event delegation for performance) ---------- */
        function renderBoard() {
            boardEl.innerHTML = "";
            boardEl.style.gridTemplateColumns = "repeat(" + state.cols + ", var(--cell))";

            const frag = document.createDocumentFragment();
            for (let r = 0; r < state.rows; r++) {
                for (let c = 0; c < state.cols; c++) {
                    const el = document.createElement("div");
                    el.className = "cell hidden";
                    el.dataset.row = r;
                    el.dataset.col = c;
                    el.setAttribute("role", "gridcell");
                    el.setAttribute("aria-label", "Row " + (r + 1) + " column " + (c + 1));
                    el.setAttribute("aria-pressed", "false");
                    state.cellEls[r][c] = el;
                    frag.appendChild(el);
                }
            }
            boardEl.appendChild(frag);
            addCursorClass();
        }

        function addCursorClass() {
            if (state.rows === 0 || state.cols === 0) return;
            const el = cellEl(state.cursor.r, state.cursor.c);
            if (el) el.classList.add("cursor");
        }
        function removeCursorClass() {
            if (state.rows === 0 || state.cols === 0) return;
            const el = cellEl(state.cursor.r, state.cursor.c);
            if (el) el.classList.remove("cursor");
        }

        function updateCell(r, c) {
            const cell = idxToCell(r, c);
            const el = state.cellEls[r][c];
            if (!el) return;

            el.className = "cell";

            if (state.gameOver && cell.mine) {
                el.classList.add("mine");
                if (state.exploded && state.exploded[0] === r && state.exploded[1] === c) {
                    el.classList.add("exploded");
                }
                return;
            }

            if (!cell.revealed) {
                el.classList.add("hidden");
                if (cell.flagged) el.classList.add("flag");
                el.setAttribute("aria-pressed", cell.flagged ? "true" : "false");
                el.textContent = "";
                return;
            }

            el.classList.add("revealed");
            el.setAttribute("aria-pressed", "true");
            if (cell.mine) {
                el.classList.add("mine");
            } else if (cell.adjacent === 0) {
                el.classList.add("zero");
            } else {
                el.classList.add("n" + cell.adjacent);
                el.textContent = cell.adjacent;
            }
        }

        function setActiveDifficultyButton(difficulty) {
            difficultyEl.querySelectorAll("button").forEach(function (btn) {
                btn.classList.toggle("active", btn.dataset.diff === difficulty);
            });
        }

        /* ---------- HUD ---------- */
        function updateHud() {
            const remaining = state.mines - state.flagCount;
            minesEl.textContent = remaining < 0 ? remaining : remaining;
        }

        function startTimer() {
            if (state.timerInterval) return;
            state.timerInterval = setInterval(function () {
                state.timer++;
                timerEl.textContent = state.timer;
            }, 1000);
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }
        /* ---------- Game actions ---------- */
        function handleClick(r, c) {
            if (state.gameOver) return;
            const cell = idxToCell(r, c);
            if (cell.revealed) {
                // Chord/open: on a revealed numbered cell, if flags match,
                // reveal remaining unflagged neighbors in one click.
                if (cell.adjacent > 0 && flaggedNeighborCount(r, c) === cell.adjacent) {
                    chord(r, c);
                }
                return;
            }
            if (cell.flagged) return;

            if (state.firstClick) {
                state.firstClick = false;
                placeMines(r, c);
                startTimer();
            }

            if (cell.mine) {
                revealMine(r, c);
            } else {
                revealCell(r, c);
                checkWin();
            }
            refreshAutoButtons();
        }

        function handleFlag(r, c) {
            if (state.gameOver) return;
            const cell = idxToCell(r, c);
            if (cell.revealed) {
                // Right-click chord on a revealed numbered cell.
                if (cell.adjacent > 0 && flaggedNeighborCount(r, c) === cell.adjacent) {
                    chord(r, c);
                }
                return;
            }
            cell.flagged = !cell.flagged;
            state.flagCount += cell.flagged ? 1 : -1;
            updateCell(r, c);
            updateHud();
        }

        /** Chord/open: reveal all unflagged neighbors of a satisfied number. */
        function chord(r, c) {
            if (state.gameOver) return;
            const cell = idxToCell(r, c);
            if (cell.adjacent === 0) return;
            if (flaggedNeighborCount(r, c) !== cell.adjacent) return;

            for (const pair of neighbors(r, c)) {
                const n = idxToCell(pair[0], pair[1]);
                if (!n.revealed && !n.flagged) {
                    if (n.mine) {
                        revealMine(pair[0], pair[1]);
                        return;
                    }
                    revealCell(pair[0], pair[1]);
                }
            }
            checkWin();
        }

        function revealCell(r, c) {
            const cell = idxToCell(r, c);
            if (cell.revealed || cell.flagged || cell.mine) return;

            cell.revealed = true;
            state.revealedCount++;
            updateCell(r, c);
            if (cell.adjacent === 0) {
                for (const pair of neighbors(r, c)) {
                    const n = idxToCell(pair[0], pair[1]);
                    if (!n.revealed && !n.flagged && !n.mine) revealCell(pair[0], pair[1]);
                }
            }
        }

        function revealMine(r, c) {
            state.gameOver = true;
            state.exploded = [r, c];
            stopTimer();
            for (let row = 0; row < state.rows; row++) {
                for (let col = 0; col < state.cols; col++) {
                    const cell = idxToCell(row, col);
                    if (cell.mine) {
                        cell.revealed = true;
                        updateCell(row, col);
                    }
                }
            }
            resultEl.textContent = "\uD83D\uDCA5 BOOM! You hit a mine.";
            resultEl.className = "result lose";
        }

        function checkWin() {
            const safeCells = state.rows * state.cols - state.mines;
            if (state.revealedCount >= safeCells && !state.gameOver) {
                state.won = true;
                state.gameOver = true;
                stopTimer();

                // Record best time / best score for this difficulty.
                const rec = saveBest(state.difficulty, state.rows, state.cols, state.mines,
                                     state.timer, computeScore(state.timer, state.rows, state.cols, state.mines));
                if (rec) updateBestDisplay();

                // Auto-flag remaining mines for satisfaction.
                for (let r = 0; r < state.rows; r++) {
                    for (let c = 0; c < state.cols; c++) {
                        const cell = idxToCell(r, c);
                        if (cell.mine && !cell.flagged) {
                            cell.flagged = true;
                            state.flagCount++;
                            updateCell(r, c);
                        }
                    }
                }
                updateHud();

                resultEl.textContent = "\uD83C\uDF89 You win!";
                resultEl.className = "result win";
                spawnConfetti();
            }
        }

        /* ==========================================================================
           Confetti (victory animation)
           ========================================================================== */
        const CONFETTI_COLORS = ["#4f9cf9", "#35c485", "#ff5c5c", "#ffd166", "#9b7bff", "#40c0c0", "#ff9f43"];
        function spawnConfetti() {
            confettiEl.innerHTML = "";
            const count = Math.min(140, Math.max(40, state.cols * 2));
            for (let i = 0; i < count; i++) {
                const piece = document.createElement("div");
                piece.className = "confetti-piece";
                const x = Math.random() * 100;
                const drift = (Math.random() - 0.5) * 160;
                const fall = 90 + Math.random() * 40;
                const size = 6 + Math.random() * 8;
                const color = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
                piece.style.left = x + "%";
                piece.style.width = size + "px";
                piece.style.height = (size * 1.4) + "px";
                piece.style.background = color;
                piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
                piece.style.opacity = "1";
                const delay = Math.random() * 0.6;
                const duration = 1.8 + Math.random() * 1.6;
                piece.style.animation =
                    "confetti-fall " + duration + "s " + delay + "s ease-in forwards," +
                    "confetti-spin " + duration + "s " + delay + "s linear infinite";
                piece.style.setProperty("--drift", drift + "vh");
                piece.style.setProperty("--fall", fall + "vh");
                confettiEl.appendChild(piece);
            }
        }
        // Confetti keyframes (defined via injected style once).
        (function injectConfettiCss() {
            if (document.getElementById("confettiCss")) return;
            const s = document.createElement("style");
            s.id = "confettiCss";
            s.textContent =
                "@keyframes confetti-fall { 0% { transform: translateY(0) translateX(0); opacity: 1; } " +
                "100% { transform: translateY(var(--fall)) translateX(var(--drift)) rotate(720deg); opacity: 0.2; } }" +
                "@keyframes confetti-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }";
            document.head.appendChild(s);
        })();

        /* ==========================================================================
           Auto-clear / Auto-flag (progressive reveal) — preserved
           ========================================================================== */
        function updateProgress(msg, done, total) {
            autoProgressEl.textContent = msg;
            if (total > 0 && done >= 0) {
                progressFillEl.style.width = Math.min(100, (done / total) * 100) + "%";
            } else {
                progressFillEl.style.width = "0%";
            }
        }

        function refreshAutoButtons() {
            autoClearBtn.classList.toggle("active", autoState.active);
            autoFlagBtn.classList.toggle("active", autoState.autoFlag);
            autoClearBtn.disabled = state.gameOver || state.firstClick;
        }

        function stopAutoClear() {
            if (autoState.interval) {
                clearInterval(autoState.interval);
                autoState.interval = null;
            }
            autoState.active = false;
            autoState.queue = [];
            autoState.total = 0;
            refreshAutoButtons();
            updateProgress("", 0, 0);
        }

        function buildClearQueue() {
            const visited = new Set();
            const queue = [];
            const start = [];
            for (let r = 0; r < state.rows; r++) {
                for (let c = 0; c < state.cols; c++) {
                    const cell = idxToCell(r, c);
                    if (cell.revealed && !cell.mine) {
                        visited.add(r + "," + c);
                        start.push([r, c]);
                    }
                }
            }
            const frontier = start.slice();
            while (frontier.length) {
                const pair = frontier.shift();
                for (const n of neighbors(pair[0], pair[1])) {
                    const key = n[0] + "," + n[1];
                    const cell = idxToCell(n[0], n[1]);
                    if (!cell.mine && !cell.revealed && !visited.has(key)) {
                        visited.add(key);
                        queue.push([n[0], n[1]]);
                        frontier.push([n[0], n[1]]);
                    }
                }
            }
            return queue;
        }

        function toggleAutoClear() {
            if (state.firstClick) return;
            if (autoState.active) { stopAutoClear(); return; }
            if (state.gameOver) return;

            autoState.queue = buildClearQueue();
            autoState.total = autoState.queue.length;
            autoState.active = true;
            refreshAutoButtons();

            if (autoState.total === 0) {
                checkWin();
                stopAutoClear();
                return;
            }

            if (autoState.autoFlag) {
                for (let r = 0; r < state.rows; r++) {
                    for (let c = 0; c < state.cols; c++) {
                        const cell = idxToCell(r, c);
                        if (cell.mine && !cell.flagged) {
                            cell.flagged = true;
                            state.flagCount++;
                            updateCell(r, c);
                        }
                    }
                }
                updateHud();
            }

            const safe = safeCountNow();
            updateProgress("Clearing... " + state.revealedCount + "/" + safe + " safe cells", state.revealedCount, safe);

            const STEP_MS = 45;
            autoState.interval = setInterval(stepAutoClear, STEP_MS);
            stepAutoClear();
        }

        function safeCountNow() {
            return state.rows * state.cols - state.mines;
        }

        function stepAutoClear() {
            if (state.gameOver || !autoState.active) { stopAutoClear(); return; }
            const next = autoState.queue.shift();
            if (!next) {
                checkWin();
                stopAutoClear();
                return;
            }
            const r = next[0], c = next[1];
            const cell = idxToCell(r, c);
            if (cell.mine) {
                autoState.active = false;
                revealMine(r, c);
                stopAutoClear();
                return;
            }
            revealCell(r, c);
            checkWin();
            const safe = safeCountNow();
            updateProgress("Clearing... " + state.revealedCount + "/" + safe + " safe cells", state.revealedCount, safe);
        }

        function toggleAutoFlag() {
            autoState.autoFlag = !autoState.autoFlag;
            refreshAutoButtons();
        }

        /* ==========================================================================
           Touch / pointer long-press to flag
           ========================================================================== */
        function cancelLongPress() {
            if (press.timeout) {
                clearTimeout(press.timeout);
                press.timeout = null;
            }
            press.on = false;
        }

        function startLongPress(r, c, x, y) {
            cancelLongPress();
            press.startX = x;
            press.startY = y;
            press.timeout = setTimeout(function () {
                press.on = true;
                handleFlag(r, c);
                // Give tactile feedback.
                if (navigator.vibrate) navigator.vibrate(20);
            }, LONG_PRESS_MS);
        }

        /* ==========================================================================
           Event delegation on the board (one listener for all cells)
           ========================================================================== */
        function cellFromEvent(e) {
            let t = e.target;
            while (t && t !== boardEl && !(t.classList && t.classList.contains("cell"))) {
                t = t.parentNode;
            }
            if (!t || t === boardEl || !t.dataset) return null;
            return t;
        }

        boardEl.addEventListener("click", function (e) {
            if (press.on) { press.on = false; return; }  // long-press fired; ignore reveal
            const cell = cellFromEvent(e);
            if (!cell) return;
            const r = parseInt(cell.dataset.row, 10);
            const c = parseInt(cell.dataset.col, 10);
            state.cursor.r = r;
            state.cursor.c = c;
            removeCursorClass();
            addCursorClass();
            handleClick(r, c);
        });

        // Right-click flag (desktop secondary button).
        boardEl.addEventListener("contextmenu", function (e) {
            e.preventDefault();
            cancelLongPress();
            const cell = cellFromEvent(e);
            if (!cell) return;
            const r = parseInt(cell.dataset.row, 10);
            const c = parseInt(cell.dataset.col, 10);
            handleFlag(r, c);
        });

        // Double-click / double-tap chord.
        boardEl.addEventListener("dblclick", function (e) {
            const cell = cellFromEvent(e);
            if (!cell) return;
            const r = parseInt(cell.dataset.row, 10);
            const c = parseInt(cell.dataset.col, 10);
            handleFlag(r, c);   // chord when satisfied
        });

        // Pointer events for long-press on touch + mouse.
        boardEl.addEventListener("pointerdown", function (e) {
            const cell = cellFromEvent(e);
            if (!cell) return;
            if (e.button !== 0 && e.pointerType === "mouse") return; // ignore non-primary press
            const r = parseInt(cell.dataset.row, 10);
            const c = parseInt(cell.dataset.col, 10);
            startLongPress(r, c, e.clientX, e.clientY);
        });
        boardEl.addEventListener("pointerup", cancelLongPress);
        boardEl.addEventListener("pointercancel", cancelLongPress);
        boardEl.addEventListener("pointerleave", cancelLongPress);
        boardEl.addEventListener("pointermove", function (e) {
            if (!press.timeout) return;
            if (Math.abs(e.clientX - press.startX) > 10 || Math.abs(e.clientY - press.startY) > 10) {
                cancelLongPress();
            }
        });

        boardEl.addEventListener("selectstart", function (e) { e.preventDefault(); });

        // Prevent text selection / ghost long-press from the browser.
        boardEl.addEventListener("contextmenu", function () { cancelLongPress(); });

        /* ==========================================================================
           Keyboard controls (a11y)
           ========================================================================== */
        function moveCursor(dr, dc) {
            removeCursorClass();
            state.cursor.r = Math.min(state.rows - 1, Math.max(0, state.cursor.r + dr));
            state.cursor.c = Math.min(state.cols - 1, Math.max(0, state.cursor.c + dc));
            addCursorClass();
            // Keep board focused for continued keyboard use.
            boardEl.focus({ preventScroll: true });
        }

        document.addEventListener("keydown", function (e) {
            // Don't hijack keys when typing in an input.
            const tag = (e.target && e.target.tagName) || "";
            if (tag === "INPUT" || tag === "TEXTAREA") return;

            switch (e.key) {
                case "ArrowUp":    e.preventDefault(); moveCursor(-1, 0); break;
                case "ArrowDown":  e.preventDefault(); moveCursor(1, 0); break;
                case "ArrowLeft":  e.preventDefault(); moveCursor(0, -1); break;
                case "ArrowRight": e.preventDefault(); moveCursor(0, 1); break;
                case "Enter":
                case " ":
                    e.preventDefault();
                    handleClick(state.cursor.r, state.cursor.c);
                    break;
                case "f":
                case "F":
                    e.preventDefault();
                    handleFlag(state.cursor.r, state.cursor.c);
                    break;
                case "d":
                case "D":
                    e.preventDefault();
                    chord(state.cursor.r, state.cursor.c);
                    break;
                case "r":
                case "R":
                    e.preventDefault();
                    newGame(state.difficulty);
                    break;
            }
        });

        /* ==========================================================================
           Window / resize handling
           ========================================================================== */
        let resizeTimer = null;
        window.addEventListener("resize", function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                applyCellSize();
            }, 120);
        });

        /* ---------- Event wiring: top-level controls ---------- */
        restartBtn.addEventListener("click", function () {
            stopTimer();
            stopAutoClear();
            newGame(state.difficulty);
        });

        difficultyEl.addEventListener("click", function (e) {
            const btn = e.target.closest("button[data-diff]");
            if (!btn) return;
            newGame(btn.dataset.diff);
            syncCustomInputs();
        });

        autoClearBtn.addEventListener("click", toggleAutoClear);
        autoFlagBtn.addEventListener("click", toggleAutoFlag);

        function applyCustomFromEvent(ev) {
            if (ev) ev.preventDefault();
            applyCustomSize();
        }
        applyCustomBtn.addEventListener("click", applyCustomFromEvent);
        [custWidthEl, custHeightEl, custMinesEl].forEach(function (el) {
            el.addEventListener("keydown", function (e) {
                if (e.key === "Enter") applyCustomFromEvent(e);
            });
        });

        function syncCustomInputs() {
            custWidthEl.value  = state.cols;
            custHeightEl.value = state.rows;
            custMinesEl.value  = state.mines;
        }

        /* ---------- Bootstrap ---------- */
        newGame("medium");
        syncCustomInputs();
        addCursorClass();
    </script>
</body>
</html>
